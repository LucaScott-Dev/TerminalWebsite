<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luca Scott - Terminal Website</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="terminal">

        <div id="boot">
            <div class="line">Welcome to <span class="accent">Luca's Terminal</span></div>
            <div class="line">Type <span class="accent">help</span> for a list of commands</div>
            <div class="line blank"></div>
        </div>

        <div id="output"></div>

        <div id="input-line">
            <span class="prompt">visitor@luca:~$</span>
            <input id="cmdline" type="text" autocomplete="off" autofocus />
        </div>

    </div>

    <script src="js/main.js"></script>
</body>
</html>
